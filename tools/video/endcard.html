<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;650;750&display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; width: 1920px; height: 1080px; overflow: hidden; background: #0a0f1f; font-family: Inter, sans-serif; color: #fff; }
  .art { position: absolute; inset: 0; background: url('../../assets/img/art-hero.jpg') 85% 50% / cover no-repeat; opacity: .55; }
  .art::after { content: ''; position: absolute; inset: 0; background: linear-gradient(90deg, #0a0f1f 0%, rgba(10,15,31,.94) 38%, rgba(10,15,31,.4) 70%, rgba(10,15,31,.2) 100%); }
  .c { position: absolute; left: 150px; top: 50%; transform: translateY(-50%); }
  .brand { display: flex; align-items: flex-end; font-weight: 650; letter-spacing: -0.03em; line-height: 1; }
  .brand img { width: 108px; height: 108px; margin-right: 4px; }
  .brand .w { font-size: 93px; padding-bottom: 12px; }
  h1 { margin: 54px 0 0; font-size: 84px; line-height: 1.05; letter-spacing: -0.035em; font-weight: 750; }
  p { margin: 34px 0 0; font-size: 34px; color: #c3c9d9; }
  .url { margin-top: 64px; display: inline-flex; gap: 14px; align-items: center; padding: 18px 28px; border-radius: 16px; border: 1px solid rgba(255,255,255,.18); background: rgba(255,255,255,.05); font-size: 32px; font-weight: 500; font-feature-settings: "calt" 0; }
  .dot { width: 12px; height: 12px; border-radius: 50%; background: #7c8bff; box-shadow: 0 0 0 6px rgba(124,139,255,.2); }
</style></head>
<body>
  <div class="art"></div>
  <div class="c">
    <div class="brand"><img src="../../assets/img/mark.svg" alt=""><span class="w">roofdesk</span></div>
    <h1>Every source screened.<br>Every answer checked.</h1>
    <p>Nine Clocked endpoints, each with a job.</p>
    <div class="url"><span class="dot"></span>automationbot24x7.github.io/proofdesk</div>
  </div>
</body></html>
